# This docker compose file defines the setup described in
# https://docs.scion.org/en/latest/tutorials/deploy.html
name: "SCION Tutorial"

services:
  # Central switch
  switch:
    image: alpine:latest
    command: tail -f /dev/null
    networks:
      transit_net:
    cap_add:
      - NET_ADMIN # required for traffic inspection

  # Monitoring container
  monitor:
    image: sflow/tshark:latest
    network_mode: "service:switch"
    volumes:
      - ./captures:/data
    #command: sleep infinity  # Keep container running but idle
    command: tshark -i eth0 -w /data/capture.pcap


  scion01:
    image: scion01:1.0
    container_name: scion01
    hostname: scion01
    networks:
      as_net_01: {}
      transit_net:
        ipv4_address: 10.100.0.11
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /home/shared:/shared
    tmpfs:
      - /run
      - /run/lock
  scion02:
