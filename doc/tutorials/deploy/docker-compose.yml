  as_net_10:
    ipam:
      config:
        - subnet: 10.20.5.0/24
  # ISD 03
  as_net_11:
    ipam:
      config:
        - subnet: 10.30.1.0/24
  as_net_12:
    ipam:
      config:
        - subnet: 10.30.2.0/24
  as_net_13:
    ipam:
      config:
        - subnet: 10.30.3.0/24
  as_net_14:
    ipam:
      config:
        - subnet: 10.30.4.0/24
  as_net_15:
    ipam:
      config:
        - subnet: 10.30.5.0/24
  # transit_net simulates a Tier 1 network the ASes are all running within.
  transit_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/24
    # Not sure if these work as intended, having to test it
    driver_opts:
      com.docker.network.bridge.promisc: "true"  # Allow monitoring all traffic
      com.docker.network.bridge.enable_icc: "true"  # Enable inter-container communication
