networks:
# ISD 01
  as_net_01:
    ipam:
      config:
        - subnet: 10.10.1.0/24
  as_net_02:
    ipam:
      config:
        - subnet: 10.10.2.0/24
  as_net_03:
    ipam:
      config:
        - subnet: 10.10.3.0/24
  as_net_04:
    ipam:
      config:
        - subnet: 10.10.4.0/24
  as_net_05:
    ipam:
      config:
        - subnet: 10.10.5.0/24
  # ISD 02
  as_net_06:
    ipam:
      config:
        - subnet: 10.20.1.0/24
  as_net_07:
